spring.application.name=pro

# Base de donnees PostgreSQL lancee par docker compose (voir README).
# Les valeurs par defaut sont celles de docker-compose.yml et sont surchargeables
# par variables d'environnement (DB_URL, DB_USER, DB_PASSWORD).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ebank}
spring.datasource.username=${DB_USER:ebank}
spring.datasource.password=${DB_PASSWORD:ebank}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

# JWT : le secret vient de l'environnement (JWT_SECRET, 32 caracteres minimum).
# Absent : une cle aleatoire est generee au demarrage (tokens perdus au redemarrage).
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Aucune trace technique dans les reponses d'erreur (info disclosure).
# La stack trace reste dans les logs serveur, jamais dans le corps HTTP.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# Logs : INFO par defaut, pas de SQL ni de DEBUG applicatif.
logging.level.root=INFO
logging.level.com.SecBank.pro=INFO
logging.level.org.hibernate.SQL=WARN
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
