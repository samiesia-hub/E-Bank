# Profil production : logs sobres, aucune trace technique exposee au client.
# Activation : SPRING_PROFILES_ACTIVE=prod (ou --spring.profiles.active=prod).
# Niveaux : INFO pour l'application, WARN pour les bibliotheques (DEBUG desactive).
logging.level.root=INFO
logging.level.com.SecBank.pro=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

# Ni SQL genere ni trace technique dans les reponses HTTP.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
