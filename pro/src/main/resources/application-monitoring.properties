# Endpoints Actuator visibles pour le TP
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# Affiche aussi l'état PostgreSQL dans /actuator/health
management.endpoint.health.show-details=always

# Nom commun ajouté à toutes les métriques E-Bank
management.metrics.tags.application=e-bank-backend

# Nécessaire pour calculer le percentile p95 des requêtes HTTP
management.metrics.distribution.percentiles-histogram.http.server.requests=true
logging.level.com.SecBank.pro=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-}] %logger{36} - %msg%n
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=e-bank-backend
management.metrics.distribution.percentiles-histogram.http.server.requests=true