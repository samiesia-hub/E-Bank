services:
  db:
    image: postgres:16-alpine
    container_name: ebank-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ebank}
      POSTGRES_USER: ${POSTGRES_USER:-ebank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ebank}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ebank-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ebank} -d ${POSTGRES_DB:-ebank}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ebank-db-data:
