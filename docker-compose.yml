services:
  db:
    image: postgres:16-alpine
    container_name: ebank-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ebank}
      POSTGRES_USER: ${POSTGRES_USER:-ebank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ebank}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ebank-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ebank} -d ${POSTGRES_DB:-ebank}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Qualite du code (Membre 2 - Mohamed) -------------------------------
  # Base dediee a SonarQube : ne pas melanger avec la base applicative "db".
  sonar-db:
    image: postgres:16-alpine
    container_name: ebank-sonar-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SONAR_DB_NAME:-sonar}
      POSTGRES_USER: ${SONAR_DB_USER:-sonar}
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:-sonar}
    volumes:
      - ebank-sonar-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SONAR_DB_USER:-sonar} -d ${SONAR_DB_NAME:-sonar}"]
      interval: 5s
      timeout: 5s
      retries: 10

  sonarqube:
    image: ${SONARQUBE_IMAGE:-sonarqube:26.11.0.134175-community}
    container_name: ebank-sonarqube
    restart: unless-stopped
    depends_on:
      sonar-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/${SONAR_DB_NAME:-sonar}
      SONAR_JDBC_USERNAME: ${SONAR_DB_USER:-sonar}
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:-sonar}
    ports:
      - "${SONAR_PORT:-9000}:9000"
    volumes:
      - ebank-sonar-data:/opt/sonarqube/data
      - ebank-sonar-logs:/opt/sonarqube/logs
      - ebank-sonar-extensions:/opt/sonarqube/extensions
    healthcheck:
      # Sonde TCP (bash est toujours present dans l'image) ; l'etat reel du
      # serveur est verifie via /api/system/status par analyze.sh.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000'"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 90s

  # Scanner utilise par devops/sonarqube/analyze.sh (profil "quality" :
  # "docker compose up -d" ne le demarre pas).
  sonar-scanner:
    image: ${SONAR_SCANNER_IMAGE:-sonarsource/sonar-scanner-cli:latest}
    profiles: ["quality"]
    depends_on:
      - sonarqube
    environment:
      SONAR_HOST_URL: http://sonarqube:9000
      SONAR_TOKEN: ${SONAR_TOKEN:-}
    volumes:
      - .:/usr/src
    working_dir: /usr/src

volumes:
  ebank-db-data:
  ebank-sonar-db-data:
  ebank-sonar-data:
  ebank-sonar-logs:
  ebank-sonar-extensions:
