# ---------------------------------------------------------------------------
# Analyse SonarQube du projet E-Bank (Membre 2 - Mohamed).
# Lancer depuis la racine du depot :
#   SONAR_TOKEN=xxx devops/sonarqube/analyze.sh
# Le serveur est fourni par la variable d'environnement SONAR_HOST_URL
# (docker compose : http://sonarqube:9000, poste local : http://localhost:9000).
# ---------------------------------------------------------------------------

sonar.projectKey=e-bank
sonar.projectName=E-Bank
sonar.projectVersion=0.0.1-SNAPSHOT
sonar.sourceEncoding=UTF-8

# --- Perimetre analyse : backend Java + frontend TypeScript/React -----------
sonar.sources=pro/src/main/java,e-bank-frontend/src
sonar.tests=pro/src/test/java
sonar.java.source=21
sonar.java.binaries=pro/target/classes
sonar.java.test.binaries=pro/target/test-classes

# --- Fichiers generes / dependances / assets non applicatifs ---------------
sonar.exclusions=\
  **/node_modules/**,\
  **/.next/**,\
  **/target/**,\
  **/build/**,\
  **/dist/**,\
  **/*.min.js,\
  e-bank-frontend/public/**,\
  e-bank-frontend/next-env.d.ts

# Classes sans logique metier : pas de couverture exigee (DTO, entites JPA,
# points d'entree Spring Boot).
sonar.coverage.exclusions=\
  pro/src/main/java/com/SecBank/pro/Dtos/**,\
  pro/src/main/java/com/SecBank/pro/Models/**,\
  pro/src/main/java/com/SecBank/pro/ProApplication.java,\
  pro/src/main/java/com/SecBank/pro/ServletInitializer.java

# Feuilles de style : pas de recherche de duplication dessus.
sonar.cpd.exclusions=e-bank-frontend/src/app/globals.css,e-bank-frontend/src/app/(client)/tableau-de-bord/dashboard.css

# --- Rapports fournis par Soukayna (tests et couverture) -------------------
# Backend : genere par JaCoCo a chaque "mvn test" (voir pro/pom.xml).
sonar.coverage.jacoco.xmlReportPaths=pro/target/site/jacoco/jacoco.xml
sonar.junit.reportPaths=pro/target/surefire-reports
# Frontend : lcov produit par "npm test -- --coverage" (Vitest/Jest).
sonar.javascript.lcov.reportPaths=e-bank-frontend/coverage/lcov.info
